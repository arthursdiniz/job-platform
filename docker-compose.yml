services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobplatform
      POSTGRES_USER: ${DATABASE_USERNAME:-jobplatform}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-jobplatform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobplatform
      DATABASE_USERNAME: ${DATABASE_USERNAME:-jobplatform}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-jobplatform}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-key-with-at-least-32-characters}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
