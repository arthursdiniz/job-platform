spring:
  application:
    name: job-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobplatform}
    username: ${DATABASE_USERNAME:jobplatform}
    password: ${DATABASE_PASSWORD:jobplatform}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-change-before-production-12345}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
