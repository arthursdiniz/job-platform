spring:
  datasource:
    url: jdbc:h2:mem:jobplatform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha-256-signature
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
